# ─────────────────────────────────────────────────────────────────────────────
#  Due Diligence Agents Platform — Docker Compose
#  Services: mongodb · redis · backend (Python) · server (Node) ·
#            client (React) · prometheus · grafana
#
#  External port mapping (to avoid conflicts with local services):
#    MongoDB:    localhost:27117 → container:27017
#    Redis:      localhost:6479  → container:6379
#    Backend:    localhost:8100  → container:8000
#    Server:     localhost:4100  → container:4000
#    Client:     localhost:5173  → container:3000
#    Prometheus: localhost:9190  → container:9090
#    Grafana:    localhost:3100  → container:3001
# ─────────────────────────────────────────────────────────────────────────────

networks:
  dd-network:
    driver: bridge

volumes:
  mongodb_data:
  redis_data:
  grafana_data:
  prometheus_data:
  uploads_data:

services:

  # ──────────────────────────────────────────────
  #  MongoDB 7 — document store for all deal data
  # ──────────────────────────────────────────────
  mongodb:
    image: mongo:7
    container_name: dd_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-ddadmin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASS:-ddpassword}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-diligence}
    ports:
      - "27117:27017"
    volumes:
      - mongodb_data:/data/db
      - ./infra/mongo/init.js:/docker-entrypoint-initdb.d/init.js:ro
    networks:
      - dd-network
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ──────────────────────────────────────────────
  #  Redis 7 — pub/sub + caching
  # ──────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: dd_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASS:-redispassword} --appendonly yes
    ports:
      - "6479:6379"
    volumes:
      - redis_data:/data
    networks:
      - dd-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASS:-redispassword}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ──────────────────────────────────────────────
  #  Python FastAPI — AI engine (13 agents)
  # ──────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: dd_backend
    restart: unless-stopped
    env_file: .env
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - MONGO_URI=mongodb://${MONGO_ROOT_USER:-ddadmin}:${MONGO_ROOT_PASS:-ddpassword}@mongodb:27017/${MONGO_DB:-diligence}?authSource=admin
      - REDIS_URL=redis://:${REDIS_PASS:-redispassword}@redis:6379/0
      - UPLOAD_DIR=/app/uploads
      - PYTHONUNBUFFERED=1
    ports:
      - "8100:8000"
    volumes:
      - ./backend:/app
      - uploads_data:/app/uploads
    networks:
      - dd-network
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 40s

  # ──────────────────────────────────────────────
  #  Node.js Express — API gateway + WebSocket
  # ──────────────────────────────────────────────
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: dd_server
    restart: unless-stopped
    env_file: .env
    environment:
      - NODE_ENV=development
      - PORT=4000
      - MONGO_URI=mongodb://${MONGO_ROOT_USER:-ddadmin}:${MONGO_ROOT_PASS:-ddpassword}@mongodb:27017/${MONGO_DB:-diligence}?authSource=admin
      - REDIS_URL=redis://:${REDIS_PASS:-redispassword}@redis:6379/0
      - PYTHON_BACKEND_URL=http://backend:8000
      - CLIENT_ORIGIN=http://localhost:5173
    ports:
      - "4100:4000"
    volumes:
      - ./server/src:/app/src
      - uploads_data:/app/uploads
    networks:
      - dd-network
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ──────────────────────────────────────────────
  #  React Vite — web dashboard
  # ──────────────────────────────────────────────
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
      target: development
    container_name: dd_client
    restart: unless-stopped
    environment:
      - VITE_API_URL=http://localhost:4100
      - VITE_WS_URL=http://localhost:4100
    ports:
      - "5173:3000"
    volumes:
      - ./client/src:/app/src
      - ./client/public:/app/public
      - ./client/index.html:/app/index.html
    networks:
      - dd-network
    depends_on:
      server:
        condition: service_started

  # ──────────────────────────────────────────────
  #  Prometheus — metrics scraping
  # ──────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: dd_prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
      - "--web.enable-lifecycle"
    ports:
      - "9190:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - dd-network
    depends_on:
      - backend
      - server

  # ──────────────────────────────────────────────
  #  Grafana — observability dashboards
  # ──────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.0
    container_name: dd_grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASS:-grafanapassword}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/var/lib/grafana/dashboards/system-health.json
      - GF_SERVER_HTTP_PORT=3001
    ports:
      - "3200:3001"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    networks:
      - dd-network
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3001/api/health || exit 1"]
      interval: 20s
      timeout: 10s
      retries: 5
      start_period: 30s
