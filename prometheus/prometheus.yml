# ─────────────────────────────────────────────────────────────────────────────
#  Prometheus Configuration
#  Scrapes: Python FastAPI backend + Node.js server
# ─────────────────────────────────────────────────────────────────────────────

global:
  scrape_interval: 15s          # Pull metrics every 15 seconds
  evaluation_interval: 15s      # Evaluate rules every 15 seconds
  external_labels:
    project: "due-diligence-agents"
    environment: "development"

# ── Alerting (placeholder — rules added in Phase 5) ──────────────────────────
# alerting:
#   alertmanagers:
#     - static_configs:
#         - targets: ['alertmanager:9093']

# ── Scrape configs ────────────────────────────────────────────────────────────
scrape_configs:

  # Prometheus itself
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # Python FastAPI backend — exposes /metrics via prometheus-client
  - job_name: "dd-backend"
    metrics_path: "/metrics"
    scrape_interval: 10s
    static_configs:
      - targets: ["backend:8000"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: "python-backend"

  # Node.js Express server — will expose /metrics in Phase 3
  - job_name: "dd-server"
    metrics_path: "/metrics"
    scrape_interval: 15s
    static_configs:
      - targets: ["server:4000"]
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: "node-server"
