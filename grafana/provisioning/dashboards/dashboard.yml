apiVersion: 1

providers:
  - name: "Due Diligence Dashboards"
    orgId: 1
    folder: "Due Diligence Agents"
    folderUid: "dd-agents"
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
